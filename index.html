<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Music for 18 Bouncy Balls</title>
  <meta name="description" content="You're Steve Reich, you're in a vintage Paris music instrument shop, and you have a bouncy ball gun.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="popups"></div>
  <div id="crosshair"><i></i></div>

  <div id="hud" class="hidden">
    <div class="panel score">
      <span class="label">Score</span>
      <span id="score">0</span>
    </div>
    <div class="panel symphony">
      <div class="row"><span class="label">Ensemble</span><b id="mult">×1</b></div>
      <div id="meter"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="row"><span id="level">Tuning up</span><span id="chord"></span></div>
    </div>
  </div>
  <button id="mute" aria-label="Toggle sound">🔊</button>
  <div id="hint">Click to launch on the pulse · hold to build a pattern · right-click to pin a second gun that drifts out of phase</div>

  <div id="overlay">
    <div class="card">
      <h1>Music for <span>18 Bouncy Balls</span></h1>
      <p class="tag">You're Steve Reich, you're in a vintage Paris music instrument shop, and you have a bouncy ball gun.</p>
      <div class="buttons"><button id="play">Play</button></div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
