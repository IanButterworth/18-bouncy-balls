  <canvas id="c"></canvas>

  </div>

  <div id="hint"></div>
  <div id="landscape" class="landscape">Better in landscape</div>

  <div id="overlay">
    <div class="card">
      <h1>Music for <span>18 Bouncy Balls</span></h1>
      <p class="tag">You're Steve Reich, you're in a vintage Paris music instrument shop, and you have a bouncy ball gun, or two.</p>
      <div class="buttons"><button id="play">Play</button></div>
      <p class="nudge"><span class="landscape">Better in landscape</span><span class="wide">Better with headphones</span></p>
